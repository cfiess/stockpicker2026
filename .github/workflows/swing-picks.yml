name: Swing Trade Picks

on:
  workflow_dispatch:

permissions:
  contents: write   # needed to commit picks_log.csv back to repo

jobs:
  swing-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run swing screener
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python swing_main.py --picks 3

      - name: Commit picks log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add picks_log.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Log picks $(date +%Y-%m-%d)"
          git push || true
